name: Abalone server engine tests

on:
  push:
    branches: [feature/secure-accounts-elo]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/abalone-engine-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/abalone-engine-tests.yml"

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Type-check authoritative engine and endpoint
        run: deno check supabase/functions/_shared/abalone-engine.ts supabase/functions/abalone-move/index.ts
      - name: Run engine tests
        run: deno test --allow-net supabase/functions/_shared/abalone-engine_test.ts
